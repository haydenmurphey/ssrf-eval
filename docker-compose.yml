name: ssrf-eval

services:
  vulnerable-app:
    build: ./app
    networks:
      - public-net
      - internal-net
    environment:
      - NODE_ENV=production

  internal-dashboard:
    build: ./internal-dashboard
    networks:
      - internal-net
    environment:
      - SECRET_API_KEY=${SECRET_API_KEY:?SECRET_API_KEY must be generated at runtime (use make up)}

  mcp-server:
    build: ./mcp-server
    networks:
      - public-net
    environment:
      - ALLOWED_TARGET=http://vulnerable-app:3000

networks:
  public-net:
    driver: bridge
    internal: true
  internal-net:
    driver: bridge
    internal: true
